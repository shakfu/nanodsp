name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    name: QA (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

      - name: Format with ruff
        run: uv run ruff format --check src/ tests/

      - name: Type check with mypy
        run: uv run mypy src/nanodsp tests/ --exclude '.venv'

      - name: Run tests
        run: uv run pytest tests/ -v --cov=src/nanodsp --cov-report=xml

  build:
    name: Build (${{ matrix.os }}/py${{ matrix.python-version }})
    needs: qa
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Build extension
        run: uv build --wheel

      # Test the wheel that is uploaded, not the editable install `uv sync`
      # made: packaging mistakes (a missing stub or licence file) only show here.
      - name: Test the built wheel
        shell: bash
        run: |
          venv="$RUNNER_TEMP/wheel-venv"
          uv venv "$venv" --python ${{ matrix.python-version }}
          if [ -x "$venv/bin/python" ]; then py="$venv/bin/python"; else py="$venv/Scripts/python.exe"; fi
          uv pip install --python "$py" dist/*.whl pytest
          "$py" -c "import nanodsp, sys; assert 'site-packages' in nanodsp.__file__, nanodsp.__file__"
          "$py" -m pytest tests/ -q

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 7

  collect-artifacts:
    name: Collect all artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-wheels
          pattern: wheel-*
          merge-multiple: true

      - name: List collected wheels
        run: ls -la all-wheels/

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v7
        with:
          name: all-wheels
          path: all-wheels/
          retention-days: 14
